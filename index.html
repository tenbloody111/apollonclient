    body {

      background-color: #f2f2f2;
      text-align: center;
      margin: 0;
      padding: 50px 10px; /* Jarak atas bawah dikurangi agar pas di layar HP */
    }
    .box {
      background: white;
      padding: 20px; /* Dikurangi sedikit dari 30px agar hemat ruang di HP */
      display: inline-block;
      border-radius: 5px;
      box-shadow: 0px 2px 10px rgba(0,0,0,0.1);

      width: 90%;          /* Lebar kotak akan mengambil 90% lebar layar HP */
      max-width: 350px;    /* Lebar kotak TIDAK AKAN LEBIH dari 350px jika dibuka di PC */
      box-sizing: border-box; /* Memastikan padding tidak merusak ukuran lebar */
    }
    
    h1 {
      font-size: 24px; /* Ukuran font disesuaikan agar tidak kebesaran di HP */
      margin-top: 10px;
    }

    .info-mc {
      text-align: left;
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 5px;
      border: 1px solid #e3e3e3;
      margin-bottom: 12px;
      /* Mencegah teks panjang terpotong atau keluar dari kotak */
      word-wrap: break-word; 
      overflow-wrap: break-word;
    }
    .info-mc p {
      margin: 8px 0;
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    /* Kotak informasi tambahan untuk penjelasan CLONE */
    .info-note {
      text-align: center;
      background-color: #fffbe6;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ffe58f;
      margin-bottom: 20px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .info-note p {
      margin: 0;
      font-size: 13px;
      font-weight: bold;
      color: #d48806;
    }

    .section-title {
      font-weight: bold;
      font-size: 14px;
      color: #333;
      margin-top: 15px;
      margin-bottom: 8px;
      text-align: left;
    }
    
    /* Gaya untuk tombol Download */
    .btn-download {
      display: block;
      background-color: #6366F1; /* Warna Indigo/Ungu Modern */
      color: white;
      padding: 12px 15px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
      margin-bottom: 12px; /* Jarak antar tombol download */
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn-download:hover {
      background-color: #4f46e5;
    }

    /* Highlight khusus tombol versi terbaru */
    .btn-latest {
      background-color: #10B981; /* Warna Hijau/Emerald Modern */
    }
    .btn-latest:hover {
      background-color: #059669;
    }
    
    /* Gaya khusus untuk tombol download terakhir agar memberi jarak ke tombol exit */
    .space-bottom {
      margin-bottom: 25px;
    }
    
    /* Gaya untuk link Exit / Keluar */
    .btn-exit {
      color: #e74c3c;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      display: inline-block;
      padding: 10px; /* Ditambah padding agar area klik di HP lebih pas */
    }
    .btn-exit:hover {
      text-decoration: underline;
    }
